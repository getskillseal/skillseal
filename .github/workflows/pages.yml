name: pages

# Publishes the Skills Hub, the Seal-a-skill page, and the docs to GitHub Pages.
# The bare site URL opens the hub; /docs and /hub/seal.html are also served.

on:
  push:
    branches: [main]
    paths:
      - "web/hub/**"
      - "web/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/site/package-lock.json
      - name: Install
        working-directory: web/site
        run: npm ci --no-audit --no-fund
      # generate-skill-docs copies hub/index.html, hub/seal.html and
      # hub/catalog.json into the site, then Docusaurus builds it.
      - name: Build site
        working-directory: web/site
        run: npm run build
      - name: Confirm the hub shipped
        run: |
          test -f web/site/build/hub/index.html
          test -f web/site/build/hub/seal.html
          test -f web/site/build/hub/catalog.json
          echo "hub, seal, and catalogue are in the build"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
