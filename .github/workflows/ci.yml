name: demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # The trust store builds from source when Docker isn't used. Cache the
      # kappa-registry release build so CI stays fast after the first run.
      - name: Cache trust store build
        uses: actions/cache@v4
        with:
          path: |
            trust-store/kappa-registry/target
            ~/.cargo/registry
            ~/.cargo/git
          key: trust-store-${{ runner.os }}-v1

      - name: Run the full demo
        run: ./demo.sh

      - name: Run the agent demo (fetch + verify + use a skill from storage)
        run: ./agent-demo.sh

      - name: Token layer (offline checks)
        run: |
          set -euo pipefail
          node -e "
            const {createToken,readToken}=await import(\"./skillseal/token.mjs\");
            const t=createToken({fingerprint:\"sha256:\"+\"ab\".repeat(32),publisherKey:\"cd\".repeat(32),signature:\"ef\".repeat(64),name:\"demo\",locations:[\"https://x.io/b\"]});
            if(readToken(t).name!==\"demo\") throw new Error(\"round trip failed\");
            if(readToken(\"skill://\"+t).name!==\"demo\") throw new Error(\"uri form failed\");
            let caught=false; try{ readToken(t.slice(0,-1)+\"q\"); }catch{ caught=true; }
            if(!caught) throw new Error(\"a damaged token was accepted\");
            console.log(\"token round trip, uri form, and damage rejection all pass\");
          " --input-type=module
          node skillseal/cli.mjs where > /dev/null && echo "agent detection runs"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: evidence/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install docs dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      # Generates a page per skill, then builds. Fails the job if a skill page
      # or the site itself does not build.
      - name: Build the documentation site
        working-directory: website
        run: npm run build

      - name: Check the generated skill routes exist
        working-directory: website
        run: |
          set -euo pipefail
          for f in build/index.html \
                   build/docs/user-guide/skills/bundled.html \
                   build/docs/user-guide/skills/bundled/data/data-csv-stats.html \
                   build/hub/index.html; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
            echo "ok: $f"
          done
          grep -q "sha256:" build/docs/user-guide/skills/bundled/data/data-csv-stats.html \
            || { echo "skill page is missing its content address"; exit 1; }
          echo "skill page carries its content address"
