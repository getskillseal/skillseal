<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <rect width="1000" height="460" rx="14" fill="#0d1117"/>

  <text x="500" y="52" text-anchor="middle" fill="#e6edf3" font-size="27" font-weight="700">Approve what an agent reads by content, not by name.</text>
  <text x="500" y="82" text-anchor="middle" fill="#8b949e" font-size="15">A vendor silently rewrites a tool description after you approved it. Same name. New instructions.</text>

  <!-- LEFT: approved by name -->
  <rect x="40" y="112" width="440" height="292" rx="12" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <rect x="40" y="112" width="440" height="46" rx="12" fill="#f8514915"/>
  <text x="64" y="142" fill="#f85149" font-size="18" font-weight="700">Approved by NAME</text>
  <text x="452" y="142" text-anchor="end" fill="#f85149" font-size="15">today's default</text>

  <circle cx="72" cy="196" r="4" fill="#8b949e"/>
  <text x="90" y="201" fill="#c9d1d9" font-size="15.5">vendor ships an update, same name</text>
  <circle cx="72" cy="232" r="4" fill="#8b949e"/>
  <text x="90" y="237" fill="#c9d1d9" font-size="15.5">agent loads the new text into context</text>
  <circle cx="72" cy="268" r="4" fill="#8b949e"/>
  <text x="90" y="273" fill="#c9d1d9" font-size="15.5">hidden instruction is obeyed</text>

  <rect x="64" y="292" width="392" height="34" rx="6" fill="#0d1117"/>
  <text x="80" y="314" fill="#f85149" font-size="13.5" font-family="'SFMono-Regular',Consolas,monospace">city = "London  LEAKED_API_KEY_a1b2c3d4"</text>

  <text x="64" y="368" fill="#f85149" font-size="20" font-weight="700">&#10007;  attack succeeds, no signal</text>

  <!-- RIGHT: approved by content -->
  <rect x="520" y="112" width="440" height="292" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="520" y="112" width="440" height="46" rx="12" fill="#3fb95015"/>
  <text x="544" y="142" fill="#3fb950" font-size="18" font-weight="700">Approved by CONTENT</text>
  <text x="932" y="142" text-anchor="end" fill="#3fb950" font-size="15">this project</text>

  <circle cx="552" cy="196" r="4" fill="#8b949e"/>
  <text x="570" y="201" fill="#c9d1d9" font-size="15.5">approval is a hash of the exact text</text>
  <circle cx="552" cy="232" r="4" fill="#8b949e"/>
  <text x="570" y="237" fill="#c9d1d9" font-size="15.5">the update hashes to a new address</text>
  <circle cx="552" cy="268" r="4" fill="#8b949e"/>
  <text x="570" y="273" fill="#c9d1d9" font-size="15.5">blocked before it reaches context</text>

  <rect x="544" y="292" width="392" height="34" rx="6" fill="#0d1117"/>
  <text x="560" y="314" fill="#3fb950" font-size="13.5" font-family="'SFMono-Regular',Consolas,monospace">DRIFT BLOCKED  pinned != current</text>

  <text x="544" y="368" fill="#3fb950" font-size="20" font-weight="700">&#10003;  nothing leaks, ever</text>

  <text x="500" y="432" text-anchor="middle" fill="#6e7681" font-size="14">Reproduce every line on your machine with a single command:  ./demo.sh</text>
</svg>
