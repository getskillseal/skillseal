<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111113"/><stop offset="1" stop-color="#0c0c0e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="fademask"><rect x="520" y="0" width="480" height="400" fill="url(#fade)"/></mask>
  </defs>

  <rect width="1000" height="400" rx="18" fill="url(#bg)"/>

  <!-- faceted shard field, right side, faint -->
  <g mask="url(#fademask)" stroke="#fff" stroke-opacity=".05" stroke-width=".7">
    <polygon points="560,20 700,-10 660,120" fill="#fff" fill-opacity=".04"/>
    <polygon points="700,-10 860,40 760,150" fill="#fff" fill-opacity=".06"/>
    <polygon points="660,120 760,150 620,240" fill="#fff" fill-opacity=".03"/>
    <polygon points="760,150 900,120 880,270" fill="#fff" fill-opacity=".05"/>
    <polygon points="860,40 1010,10 1010,180 900,120" fill="#fff" fill-opacity=".07"/>
    <polygon points="620,240 760,150 880,270 720,360" fill="#fff" fill-opacity=".04"/>
    <polygon points="880,270 1010,180 1010,420 760,410" fill="#fff" fill-opacity=".06"/>
    <polygon points="560,20 660,120 540,180" fill="#fff" fill-opacity=".03"/>
  </g>

  <!-- mascot with the verified seal -->
  <circle cx="118" cy="150" r="60" fill="#161618" stroke="rgba(255,255,255,.08)"/>
  <text x="118" y="176" text-anchor="middle" font-size="70">🦭</text>
  <g transform="translate(158,188)">
    <circle cx="0" cy="0" r="18" fill="#1d9bf0" stroke="#0c0c0e" stroke-width="3.5"/>
    <path d="M-8 1 l5 5 L10 -6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="212" y="118" fill="#f4f4f5" font-size="52" font-weight="800" letter-spacing="-1.6">SkillSeal</text>
  <text x="214" y="152" fill="#8a8a92" font-size="19">Skills you can prove. One line, any agent.</text>

  <!-- count badges, Featherless style -->
  <g font-family="'JetBrains Mono',monospace" font-size="13">
    <rect x="214" y="176" width="118" height="30" rx="15" fill="#161618" stroke="rgba(255,255,255,.09)"/>
    <text x="273" y="196" text-anchor="middle" fill="#c9c9d0">193 skills</text>
    <rect x="340" y="176" width="132" height="30" rx="15" fill="#161618" stroke="rgba(255,255,255,.09)"/>
    <text x="406" y="196" text-anchor="middle" fill="#c9c9d0">27 categories</text>
    <rect x="480" y="176" width="130" height="30" rx="15" fill="#161618" stroke="rgba(255,255,255,.09)"/>
    <text x="545" y="196" text-anchor="middle" fill="#5bd97e">0 to trust</text>
  </g>

  <!-- paste line -->
  <rect x="214" y="232" width="620" height="54" rx="12" fill="#111113" stroke="rgba(255,255,255,.08)"/>
  <text x="240" y="265" font-family="'JetBrains Mono',monospace" font-size="17">
    <tspan fill="#eeea86">npx skillseal add</tspan><tspan fill="#e8e8ec"> sk1qy9c607fvn6ngfp9cv…</tspan>
  </text>

  <!-- three promises -->
  <g font-size="14.5" fill="#8a8a92">
    <text x="214" y="322"><tspan fill="#1d9bf0">✓</tspan>  Every byte checked before it lands</text>
    <text x="214" y="350"><tspan fill="#1d9bf0">✓</tspan>  Fetched from anywhere, trusted from nowhere</text>
    <text x="214" y="378"><tspan fill="#1d9bf0">✓</tspan>  Installs as a plain skill folder every agent already reads</text>
  </g>
</svg>
