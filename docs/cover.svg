<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101012"/><stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d9bf0" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#1d9bf0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- canvas -->
  <rect x="1" y="1" width="1198" height="338" rx="22" fill="url(#bg)" stroke="rgba(255,255,255,.08)"/>

  <!-- restraint is the polish: a few faint stars, nothing more -->
  <g fill="#8aa6c8">
    <circle cx="96" cy="54" r="1.4" opacity=".45"/>
    <circle cx="150" cy="286" r="1.1" opacity=".35"/>
    <circle cx="1096" cy="70" r="1.3" opacity=".4"/>
    <circle cx="1140" cy="250" r="1" opacity=".3"/>
    <circle cx="640" cy="40" r="1" opacity=".28"/>
    <circle cx="560" cy="306" r="1.1" opacity=".3"/>
  </g>

  <!-- mascot, softly lit -->
  <ellipse cx="205" cy="172" rx="150" ry="130" fill="url(#glow)"/>
  <text x="206" y="224" text-anchor="middle" font-size="150">🦭</text>
  <!-- the seal: provably the bytes you approved -->
  <g transform="translate(268,236)">
    <circle cx="0" cy="0" r="19" fill="#1d9bf0" stroke="#0b0b0d" stroke-width="4"/>
    <path d="M-8 1 l5 5 L11 -6" fill="none" stroke="#fff" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="432" y="166" fill="#f5f5f7" font-size="92" font-weight="800" letter-spacing="-2.6">SkillSeal</text>

  <!-- accent line -->
  <text x="436" y="214" fill="#1d9bf0" font-size="21" font-weight="700" letter-spacing="4">SEAL OF APPROVAL</text>

  <!-- subtitle -->
  <text x="436" y="254" fill="#8a8a92" font-size="24">Agent skills you can trust. One line, any agent.</text>
</svg>
