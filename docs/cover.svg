<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'Space Grotesk','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101014"/><stop offset="1" stop-color="#08080a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1d9bf0" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#1d9bf0" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#1d9bf0" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e7edf3"/>
    </linearGradient>
  </defs>

  <!-- canvas: deep near-black, hairline gradient edge for a premium lockup -->
  <rect x="1.5" y="1.5" width="1197" height="337" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="337" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.5"/>

  <!-- restraint is the polish: a few faint stars, nothing more -->
  <g fill="#8aa6c8">
    <circle cx="96" cy="54" r="1.3" opacity=".38"/>
    <circle cx="150" cy="286" r="1" opacity=".28"/>
    <circle cx="1106" cy="70" r="1.2" opacity=".34"/>
    <circle cx="1150" cy="252" r="1" opacity=".24"/>
    <circle cx="650" cy="40" r="1" opacity=".22"/>
    <circle cx="560" cy="308" r="1" opacity=".24"/>
  </g>

  <!-- mascot, softly lit -->
  <ellipse cx="206" cy="172" rx="166" ry="142" fill="url(#glow)"/>
  <text x="206" y="231" text-anchor="middle" font-size="168">🦭</text>

  <!-- the seal: the X-style verified mark — provably the bytes you approved -->
  <g transform="translate(251.2,217.2) scale(1.9)">
    <path d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z" fill="#1d9bf0" stroke="#08080a" stroke-width="0.9"/>
    <path d="M7.5 12.3 l2.9 2.9 L16.4 8.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="430" y="170" fill="url(#ink)" font-size="102" font-weight="800" letter-spacing="-3">SkillSeal</text>

  <!-- accent line -->
  <text x="434" y="224" fill="#1d9bf0" font-size="33" font-weight="700" letter-spacing="4.5">YOUR SEAL OF APPROVAL</text>

  <!-- subtitle -->
  <text x="434" y="260" fill="#9aa1a9" font-size="24">Agent skills you can trust. One line, any agent.</text>
</svg>
