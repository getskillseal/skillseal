<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skills Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#ffd700;
    --bg:#07070d;
    --panel:#0c0c16;
    --nav:#0a0a11;
    --ink:#fafaf6;
    --dim:#9a968e;
    --line:rgba(255,255,255,.06);
    --line-gold:rgba(255,215,0,.25);
    --green:#4ade80; --amber:#fbbf24; --blue:#60a5fa; --purple:#a78bfa;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit;text-decoration:none}

  /* ── top nav ─────────────────────────────────────────────── */
  nav.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:1.9rem;
    padding:.85rem 1.6rem;background:var(--nav);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.05rem}
  .brand .mark{width:30px;height:30px;border-radius:6px;flex:0 0 30px;
    background:radial-gradient(circle at 34% 30%,#fff 0 18%,#c9c4b8 19% 34%,#2a2a33 35% 100%);
    border:1px solid rgba(255,255,255,.18)}
  nav.top .links{display:flex;align-items:center;gap:1.6rem;font-size:.98rem;color:#d7d3ca}
  nav.top .links a:hover{color:#fff}
  nav.top .links a.on{color:var(--gold);font-weight:500}
  nav.top .right{margin-left:auto;display:flex;align-items:center;gap:1.5rem;font-size:.98rem;color:#d7d3ca}
  .ext:after{content:"↗";font-size:.72em;margin-left:.28em;opacity:.65;vertical-align:super}

  /* ── hero (centered) ─────────────────────────────────────── */
  header.hero{position:relative;text-align:center;padding:3.6rem 1.5rem 2.6rem;overflow:hidden}
  header.hero:before{content:"";position:absolute;inset:-40% 0 auto 50%;transform:translateX(-50%);
    width:900px;height:520px;border-radius:50%;pointer-events:none;
    background:radial-gradient(ellipse at center,rgba(255,215,0,.075),transparent 62%)}
  header.hero>*{position:relative}
  .eyebrow{margin:0 0 .85rem;font-size:.78rem;font-weight:500;letter-spacing:.34em;
    text-transform:uppercase;color:var(--gold);font-family:"JetBrains Mono",monospace}
  h1{margin:0;font-size:clamp(2rem,5.6vw,3rem);font-weight:700;letter-spacing:-.04em;line-height:1.04}
  .sub{margin:1.1rem 0 0;font-size:1.12rem;color:var(--dim)}
  .sub b{color:var(--gold);font-weight:700}
  .meta{margin:1.15rem 0 0;font-size:.86rem;color:#6f6b64;display:inline-flex;align-items:center;gap:.4rem}
  .meta svg{vertical-align:middle}

  .stats{display:flex;justify-content:center;gap:3.1rem;margin-top:1.9rem;flex-wrap:wrap}
  .stat .n{font-size:1.75rem;font-weight:700;letter-spacing:-.02em;line-height:1;font-family:"JetBrains Mono",monospace}
  .stat .l{margin-top:.45rem;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

  /* ── search + source pills (centered band) ───────────────── */
  .band{border-top:1px solid var(--line);background:var(--panel);padding:1.6rem 1.5rem 1.35rem}
  .search{position:relative;max-width:660px;margin:0 auto}
  .search .ico{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--gold);opacity:.75;font-size:.95rem}
  .search input{width:100%;background:#08080f;border:1px solid var(--line);border-radius:10px;
    padding:.78rem 2.6rem;color:var(--ink);font-size:.98rem;font-family:inherit;outline:0}
  .search input:focus{border-color:var(--line-gold);box-shadow:0 0 0 3px rgba(255,215,0,.07)}
  .search input::placeholder{color:#78746d}
  .clear{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--dim);padding:.3rem .45rem}
  .clear:hover{color:var(--ink)}

  .pills{display:flex;justify-content:center;gap:.5rem;flex-wrap:wrap;margin:1.15rem auto 0;max-width:1180px}
  .pill{display:inline-flex;align-items:center;gap:.5rem;background:#10101a;border:1px solid var(--line);
    border-radius:20px;padding:.4rem .9rem;color:#c8c4bc;font-size:.88rem}
  .pill:hover{border-color:rgba(255,255,255,.14)}
  .pill.on{background:rgba(255,215,0,.1);border-color:var(--line-gold);color:var(--gold);font-weight:500}
  .pill .c{font-family:"JetBrains Mono",monospace;font-size:.76rem;opacity:.72}

  /* ── body ─────────────────────────────────────────────────── */
  .layout{display:grid;grid-template-columns:260px 1fr;gap:1.6rem;max-width:1180px;margin:0 auto;padding:1.75rem 1.5rem 4rem}
  .side .label{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:.2rem 0 .7rem}
  .cat{display:flex;align-items:center;gap:.55rem;width:100%;text-align:left;background:none;border:1px solid transparent;
    border-radius:8px;padding:.5rem .6rem;color:var(--dim);font-size:.92rem}
  .cat:hover{background:var(--panel);color:var(--ink)}
  .cat.on{background:rgba(255,215,0,.08);border-color:var(--line-gold);color:var(--ink)}
  .cat .c{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:.76rem}
  .cat.on .c{color:var(--gold)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:.75rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem;animation:cardIn .35s ease both}
  .card:hover{border-color:var(--line-gold);box-shadow:0 6px 24px rgba(0,0,0,.4)}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card .top{display:flex;align-items:center;gap:.5rem}
  .card .name{font-weight:600;font-size:1rem;letter-spacing:-.01em}
  .card .src{margin-left:auto;font-size:.72rem;border-radius:20px;padding:.15rem .6rem;border:1px solid;white-space:nowrap}
  .src.builtin{color:var(--green);border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.08)}
  .src.official{color:var(--amber);border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.08)}
  .src.community{color:var(--blue);border-color:rgba(96,165,250,.35);background:rgba(96,165,250,.08)}
  .card .desc{margin:.5rem 0 .75rem;color:var(--dim);font-size:.9rem;line-height:1.45}

  /* verified seal: one glance says "provably the bytes you approved".
     The proof itself is one hover away, so the card face stays quiet. */
  .seal{position:relative;display:inline-flex;flex:0 0 auto;line-height:0;cursor:help}
  .seal svg{width:16px;height:16px;display:block}
  .seal .tip{position:absolute;left:50%;top:calc(100% + 9px);transform:translateX(-50%) translateY(-3px);
    width:298px;background:#12121c;border:1px solid rgba(255,255,255,.1);border-radius:9px;
    padding:.7rem .8rem;box-shadow:0 12px 34px rgba(0,0,0,.62);
    opacity:0;visibility:hidden;transition:opacity .14s ease,transform .14s ease;z-index:40;text-align:left;line-height:1.5}
  .seal:hover .tip,.seal:focus-visible .tip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .seal .tip:before{content:"";position:absolute;left:50%;top:-5px;width:9px;height:9px;transform:translateX(-50%) rotate(45deg);
    background:#12121c;border-left:1px solid rgba(255,255,255,.1);border-top:1px solid rgba(255,255,255,.1)}
  .tip .h{display:flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;color:#fff;margin-bottom:.15rem}
  .tip .h svg{width:14px;height:14px}
  .tip .p{display:block;font-size:.76rem;color:var(--dim);margin:0 0 .55rem}
  .tip .row{display:flex;gap:.45rem;font-size:.68rem;margin-top:.2rem}
  .tip .row .k{color:rgba(255,215,0,.6);flex:0 0 26px}
  .tip .row .v{color:#b9b5ad;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .cmdrow{display:flex;gap:.4rem;margin-top:.75rem}
  .cmd{flex:1;background:#08080f;border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;
    font-size:.74rem;color:var(--gold);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .copy{background:rgba(255,215,0,.1);border:1px solid var(--line-gold);border-radius:6px;color:var(--gold);
    font-size:.74rem;font-weight:500;padding:.5rem .7rem;white-space:nowrap}
  .copy:hover{background:rgba(255,215,0,.18)}
  .empty{color:var(--dim);text-align:center;padding:3rem 0;font-size:.92rem}

  /* ── expandable detail ───────────────────────────────────── */
  .card{cursor:pointer;border-left:2px solid transparent}
  .card.open{border-left-color:var(--green);background:#0d0d18}
  .chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.15rem}
  .chip{font-size:.72rem;border-radius:6px;padding:.2rem .55rem;border:1px solid}
  .chip.cat{color:var(--gold);border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.07)}
  .chip.plat{color:var(--blue);border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.07)}
  .detail{display:none;margin-top:.9rem;border-top:1px solid var(--line);padding-top:.85rem;cursor:default}
  .card.open .detail{display:block;animation:cardIn .25s ease both}
  .lbl{font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:#6f6b64;margin-bottom:.35rem}
  .ov{font-size:.88rem;line-height:1.55;color:#e7e3db;margin:0 0 .9rem}
  .ov code{font-family:"JetBrains Mono",monospace;font-size:.82em;color:var(--gold)}
  .prereq{border:1px solid var(--line);border-radius:8px;padding:.65rem .75rem;margin-bottom:.85rem}
  .prereq .r{display:flex;align-items:center;gap:.75rem;font-size:.74rem}
  .prereq .r .k{color:#6f6b64;letter-spacing:.1em;text-transform:uppercase;flex:0 0 32px}
  .prereq code{font-family:"JetBrains Mono",monospace;color:var(--gold);background:rgba(255,215,0,.08);
    border:1px solid rgba(255,215,0,.2);border-radius:5px;padding:.15rem .45rem;font-size:.74rem}
  .tagrow{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.9rem}
  .tagrow span{font-size:.72rem;color:#b9b5ad;border:1px solid var(--line);border-radius:6px;padding:.22rem .55rem}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:.45rem .9rem;margin-bottom:.9rem;align-items:baseline}
  .facts dt{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#6f6b64}
  .facts dd{margin:0;font-size:.82rem;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .facts dd.mono{font-weight:400;font-size:.72rem;color:#b9b5ad}
  .docs{display:block;text-align:center;margin-top:.75rem;padding:.7rem;border-radius:8px;
    background:rgba(29,155,240,.09);border:1px solid rgba(29,155,240,.32);color:#5eb4f7;font-size:.86rem;font-weight:500}
  .docs:hover{background:rgba(29,155,240,.16);color:#8ccbfa}

  @media(max-width:900px){
    nav.top{gap:1rem;padding:.75rem 1rem}
    nav.top .links,nav.top .right{gap:1rem;font-size:.9rem}
    .layout{grid-template-columns:1fr;padding:1.25rem}
    .stats{gap:1.8rem}
  }
</style>
</head>
<body>

<nav class="top">
  <a class="brand" href="#"><span class="mark"></span>Hermes Agent</a>
  <div class="links">
    <a href="#">Docs</a>
    <a href="#" class="on">Skills</a>
    <a class="ext" href="#">Download</a>
  </div>
  <div class="right">
    <a class="ext" href="https://github.com/humuhumu33/mcp-skills-integrity">GitHub</a>
  </div>
</nav>

<header class="hero">
  <p class="eyebrow">Hermes Agent</p>
  <h1>Skills Hub</h1>
  <p class="sub">Discover, search, and install from <b id="total">0</b> skills across <span id="regs">0</span> registries</p>
  <p class="meta" id="heroMeta">Every skill verified before it runs</p>
  <div class="stats">
    <div class="stat"><div class="n" style="color:var(--green)" id="sBuiltin">0</div><div class="l">Built-in</div></div>
    <div class="stat"><div class="n" style="color:var(--amber)" id="sOptional">0</div><div class="l">Optional</div></div>
    <div class="stat"><div class="n" style="color:var(--blue)" id="sCommunity">0</div><div class="l">Community</div></div>
    <div class="stat"><div class="n" style="color:var(--purple)" id="sCats">0</div><div class="l">Categories</div></div>
  </div>
</header>

<div class="band">
  <div class="search">
    <span class="ico">⌕</span>
    <input id="q" placeholder='Search skills... (press "/" to focus)' autocomplete="off" />
    <button class="clear" id="clear" hidden>✕</button>
  </div>
  <div class="pills" id="pills"></div>
</div>

<div class="layout">
  <nav class="side">
    <div class="label">Categories</div>
    <div id="cats"></div>
  </nav>
  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden>No skills match your search.</div>
  </main>
</div>

<script>
const ICON={all:"📋",data:"📊",document:"📄",devops:"⚙️",web:"🌐",security:"🛡️",productivity:"✅"};
const LABEL={all:"All Skills",data:"Data",document:"Document",devops:"DevOps",web:"Web",security:"Security",productivity:"Productivity"};
const SRCLABEL={all:"All",builtin:"Built-in",official:"Optional",community:"Community"};
const REPO="https://github.com/humuhumu33/mcp-skills-integrity/blob/main";
// Generated skill pages, same route shape as the upstream hub docs.
const DOCS="/mcp-skills-integrity/docs/user-guide/skills/bundled";
const EMBEDDED=[
 {name:"csv-stats",source:"official",category:"data",desc:"Summarize a CSV file: row count, columns, and numeric means.",
  overview:"Run <code>scripts/stats.py</code> over a CSV and return a JSON summary: row count, column names, and the mean of every numeric column. Standard library only, deterministic output.",
  prereq:{kind:"cmd",value:"python3"},tags:["csv","analysis","data"],platforms:["macOS","Linux"],version:"1.0.0",author:"example",license:"MIT",
  address:"sha256:4e8cb35109ab6ae6069b6c984ebd52c659712905c83eaf7a0f662b1251e63d50",cid:"bafybeic6…q7m",
  docs:DOCS+"/data/data-csv-stats"},
 {name:"pdf-fill",source:"official",category:"document",desc:"Fill a PDF form from a JSON record and return the completed file.",
  overview:"Read the field map in <code>references/fields.md</code>, then run <code>scripts/fill.py</code> to write a completed copy. Flatten only when asked; flattened PDFs are no longer editable.",
  prereq:{kind:"cmd",value:"python3"},tags:["pdf","forms","automation"],platforms:["macOS","Linux"],version:"1.0.0",author:"example",license:"MIT",
  address:"sha256:ab27cf7f3afa2c71ee18fe21057cdfa80dbaf499521ca62859423a9669450f06",cid:"bafybeidf…8kp",
  docs:DOCS+"/document/document-pdf-fill"},
 {name:"release-notes",source:"builtin",category:"devops",desc:"Draft categorized release notes from a list of merged pull requests.",
  overview:"Group merged pull requests into Features, Fixes, and Maintenance; write one past-tense bullet per change in user-facing language, breaking changes first.",
  tags:["git","changelog","release"],platforms:["Any"],version:"1.0.1",author:"Hermes Agent",license:"MIT",
  address:"sha256:84a63c3deed30805c00c9267c9133ee6057d1233a979421d383be71742d23c50",cid:"bafybeih9…2ab",
  docs:REPO+"/skills/release-notes/SKILL.md"},
 {name:"sql-explain",source:"community",category:"data",desc:"Explain a SQL query plan in plain language and flag slow scans.",
  overview:"Parse an <code>EXPLAIN</code> plan, describe each step in plain language, and call out full table scans, missing indexes, and expensive joins.",
  prereq:{kind:"cmd",value:"psql"},tags:["sql","perf","database"],platforms:["Any"],version:"0.4.2",author:"community",license:"Apache-2.0",
  address:"sha256:11aa22bb33cc44dd55ee66ff77008899aabbccddeeff00112233445566778899",cid:"bafybeig2…mn4",
  docs:REPO+"/docs/design/encoding-hermes-skills.md"},
 {name:"dockerfile-lint",source:"community",category:"devops",desc:"Review a Dockerfile for security and size pitfalls; suggest fixes.",
  overview:"Check for root users, unpinned base images, secrets in layers, and cache-busting ordering; return a prioritized list of fixes with the rewritten lines.",
  prereq:{kind:"cmd",value:"docker"},tags:["docker","security","ci"],platforms:["Any"],version:"2.1.0",author:"community",license:"MIT",
  address:"sha256:99887766554433221100ffeeddccbbaa99887766554433221100ffeeddccbbaa",cid:"bafybeia7…zx1",
  docs:REPO+"/docs/design/encoding-hermes-skills.md"},
 {name:"web-scrape",source:"community",category:"web",desc:"Extract structured data from a page given a field map; respects robots.",
  overview:"Fetch a page, honour <code>robots.txt</code>, and extract fields by CSS selector into JSON. Rate limited by default and never follows offsite redirects.",
  tags:["http","parsing","web"],platforms:["Any"],version:"1.3.0",author:"community",license:"MIT",
  address:"sha256:0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0",cid:"bafybeib3…qw9",
  docs:REPO+"/docs/design/encoding-hermes-skills.md"},
 {name:"threat-model",source:"community",category:"security",desc:"Produce a STRIDE threat model for a described system and rank risks.",
  overview:"Walk the system's trust boundaries, enumerate STRIDE threats per component, then rank by likelihood and blast radius with a mitigation for each.",
  tags:["security","review","stride"],platforms:["Any"],version:"1.1.0",author:"community",license:"MIT",
  address:"sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789",cid:"bafybeif0…lk2",
  docs:REPO+"/docs/design/agent-uses-skill.md"},
 {name:"chart-builder",source:"community",category:"data",desc:"Turn a table into a clean, accessible chart spec, light and dark.",
  overview:"Pick the chart form from the data shape, then emit a spec with accessible colours that reads correctly in both light and dark themes.",
  tags:["viz","charts","accessibility"],platforms:["Any"],version:"0.9.0",author:"community",license:"MIT",
  address:"sha256:1234abcd5678ef901234abcd5678ef901234abcd5678ef901234abcd5678ef90",cid:"bafybeic1…rt6",
  docs:REPO+"/docs/design/encoding-hermes-skills.md"},
 {name:"email-triage",source:"community",category:"productivity",desc:"Classify and summarize an inbox export into actions and FYIs.",
  overview:"Sort an inbox export into Actions, Waiting, and FYI; summarize each thread in one line and surface anything with a deadline first.",
  tags:["email","summarize","inbox"],platforms:["Any"],version:"1.0.0",author:"community",license:"MIT",
  address:"sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210",cid:"bafybeid8…yu3",
  docs:REPO+"/docs/design/encoding-hermes-skills.md"},
];
// Scalloped seal, drawn here rather than borrowed: 12 bumps from alternating
// radii, rounded joins, and a white check. Blue reads as "verified" instantly.
const SEAL_PTS="12,1 14.41,3.02 17.5,2.47 18.58,5.42 21.53,6.5 20.98,9.59 23,12 20.98,14.41 21.53,17.5 18.58,18.58 17.5,21.53 14.41,20.98 12,23 9.59,20.98 6.5,21.53 5.42,18.58 2.47,17.5 3.02,14.41 1,12 3.02,9.59 2.47,6.5 5.42,5.42 6.5,2.47 9.59,3.02";
const seal=(size)=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">
  <polygon points="${SEAL_PTS}" fill="#1d9bf0" stroke="#1d9bf0" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M7.6 12.3l2.9 2.9 5.9-6.4" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

let CATALOG=[],state={cat:"all",src:"all",q:""},timer;
const cut=(s,n)=>s.length>n?s.slice(0,n)+"…":s;
const num=n=>n.toLocaleString();

function render(){
  const q=state.q.toLowerCase();
  const list=CATALOG.filter(s=>
    (state.cat==="all"||s.category===state.cat)&&
    (state.src==="all"||s.source===state.src)&&
    (!q||(s.name+" "+s.desc).toLowerCase().includes(q)));
  const grid=document.getElementById("grid");grid.innerHTML="";
  document.getElementById("empty").hidden=list.length>0;
  for(const s of list){
    const el=document.createElement("article");el.className="card";
    const plats=(s.platforms||[]).map(p=>`<span class="chip plat">${p}</span>`).join("");
    const tags=(s.tags||[]).map(t=>`<span>${t}</span>`).join("");
    const pre=s.prereq
      ? `<div class="prereq"><div class="lbl">Prerequisites</div>
           <div class="r"><span class="k">${s.prereq.kind||"cmd"}</span><code>${s.prereq.value}</code></div></div>` : "";
    el.innerHTML=`<div class="top"><span>${ICON[s.category]||"📦"}</span><span class="name">${s.name}</span>
        <span class="seal" tabindex="0" role="img" aria-label="Verified: content address and publisher signature checked">${seal(16)}
          <span class="tip">
            <span class="h">${seal(14)} Verified skill</span>
            <span class="p">These exact bytes are what the publisher signed. Your agent rechecks them before it runs.</span>
          </span>
        </span>
        <span class="src ${s.source}">${SRCLABEL[s.source]||s.source}</span></div>
      <p class="desc">${s.desc}</p>
      <div class="chips"><span class="chip cat">${LABEL[s.category]||s.category}</span>${plats}</div>
      <div class="detail">
        <div class="lbl">Overview</div>
        <p class="ov">${s.overview||s.desc}</p>
        ${pre}
        ${tags?`<div class="tagrow">${tags}</div>`:""}
        <dl class="facts">
          <dt>Author</dt><dd>${s.author||"community"}</dd>
          <dt>Version</dt><dd>${s.version||"1.0.0"}</dd>
          <dt>License</dt><dd>${s.license||"MIT"}</dd>
          <dt>&kappa;</dt><dd class="mono" title="${s.address}">${cut(s.address,34)}</dd>
          <dt>Filecoin</dt><dd class="mono" title="${s.cid}">${s.cid}</dd>
        </dl>
        <div class="cmdrow"><span class="cmd mono">hermes skills install ${s.name}</span><button class="copy">Copy</button></div>
        ${s.docs?`<a class="docs" href="${s.docs}" target="_blank" rel="noopener">View full documentation →</a>`:""}
      </div>`;
    el.querySelector(".copy").onclick=e=>{
      e.stopPropagation();
      navigator.clipboard?.writeText(`hermes skills install ${s.address}`);
      e.target.textContent="Copied";setTimeout(()=>e.target.textContent="Copy",1200);
    };
    el.querySelector(".seal").onclick=e=>e.stopPropagation();
    el.querySelector(".detail").onclick=e=>e.stopPropagation();
    el.onclick=()=>{
      const wasOpen=el.classList.contains("open");
      grid.querySelectorAll(".card.open").forEach(c=>c.classList.remove("open"));
      if(!wasOpen)el.classList.add("open");
    };
    grid.appendChild(el);
  }
}

function chrome(){
  const byCat={},bySrc={};
  CATALOG.forEach(s=>{byCat[s.category]=(byCat[s.category]||0)+1;bySrc[s.source]=(bySrc[s.source]||0)+1;});
  document.getElementById("total").textContent=num(CATALOG.length);
  document.getElementById("regs").textContent=Object.keys(bySrc).length;
  document.getElementById("sBuiltin").textContent=num(bySrc.builtin||0);
  document.getElementById("sOptional").textContent=num(bySrc.official||0);
  document.getElementById("sCommunity").textContent=num(bySrc.community||0);
  document.getElementById("sCats").textContent=num(Object.keys(byCat).length);

  const pills=document.getElementById("pills");pills.innerHTML="";
  const ORDER=["builtin","official"]; // All, Built-in, Optional, then registries
  const srcs=Object.entries(bySrc).sort((a,b)=>{
    const ai=ORDER.indexOf(a[0]),bi=ORDER.indexOf(b[0]);
    if(ai!==-1||bi!==-1)return (ai===-1?99:ai)-(bi===-1?99:bi);
    return a[0].localeCompare(b[0]);
  });
  [["all",CATALOG.length],...srcs].forEach(([s,n])=>{
    const b=document.createElement("button");
    b.className="pill"+(s===state.src?" on":"");
    b.innerHTML=`${SRCLABEL[s]||s}<span class="c">${num(n)}</span>`;
    b.onclick=()=>{state.src=s;chrome();render();};
    pills.appendChild(b);
  });

  const cats=document.getElementById("cats");cats.innerHTML="";
  [["all",CATALOG.length],...Object.entries(byCat).sort()].forEach(([c,n])=>{
    const b=document.createElement("button");
    b.className="cat"+(c===state.cat?" on":"");
    b.innerHTML=`<span>${ICON[c]||"📦"}</span><span>${LABEL[c]||c}</span><span class="c">${num(n)}</span>`;
    b.onclick=()=>{state.cat=c;chrome();render();};
    cats.appendChild(b);
  });
}

const qEl=document.getElementById("q"),clearEl=document.getElementById("clear");
qEl.addEventListener("input",e=>{
  clearEl.hidden=!e.target.value;
  clearTimeout(timer);
  timer=setTimeout(()=>{state.q=e.target.value;render();},150);
});
clearEl.onclick=()=>{qEl.value="";clearEl.hidden=true;state.q="";render();qEl.focus();};
addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==qEl){e.preventDefault();qEl.focus();}
  if(e.key==="Escape")qEl.blur();
});

document.getElementById("heroMeta").insertAdjacentHTML("afterbegin",seal(14));

(async()=>{
  try{const r=await fetch("catalog.json",{cache:"no-store"});
    if(r.ok){const j=await r.json();if(j.skills?.length)CATALOG=j.skills.map(s=>({...s,source:s.source||s.author||"community"}));}}catch{}
  if(!CATALOG.length)CATALOG=EMBEDDED;
  chrome();render();
})();
</script>
</body>
