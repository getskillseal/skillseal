<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Skill — SkillSeal</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7wn6atPC90ZXh0Pjwvc3ZnPg==">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0c0c0e;--panel:#141416;--panel-2:#1a1a1d;--ink:#f4f4f5;--dim:#8a8a92;--faint:#5c5c63;
    --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.11);--seal:#1d9bf0;--green:#5bd97e;--red:#ff8a80}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
  a{color:var(--seal);text-decoration:none} a:hover{text-decoration:underline}
  nav.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;padding:.9rem 1.9rem;
    background:#0d0d0f;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:1.1rem;color:var(--ink)}
  .brand .mark{font-size:1.4rem;line-height:1}
  nav .links{margin-left:auto;display:flex;gap:1.7rem;font-size:.92rem;color:#c7c7cd}
  nav .links a{color:#c7c7cd}
  .wrap{max-width:820px;margin:0 auto;padding:2.6rem 1.5rem 5rem}
  .back{font-size:.85rem;color:var(--faint)} .back:hover{color:var(--dim)}
  .head{margin:1.1rem 0 0;display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
  .head .ico{font-size:1.9rem;line-height:1}
  h1{font-size:1.9rem;font-weight:800;letter-spacing:-.03em;margin:0}
  .ver{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--faint)}
  .spill{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;border:1px solid var(--line-2);border-radius:7px;padding:.18rem .5rem;color:var(--dim)}
  .spill.ok{color:var(--seal);border-color:rgba(29,155,240,.4);background:rgba(29,155,240,.08)}
  .sub{margin:.5rem 0 1.6rem;color:var(--dim);font-size:1.02rem;line-height:1.6}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.4rem;margin-top:1.2rem}
  .lbl{font-family:"JetBrains Mono",monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin:0 0 .7rem}
  .files{display:flex;flex-direction:column;gap:.5rem}
  .file{display:flex;align-items:center;gap:.7rem;font-family:"JetBrains Mono",monospace;font-size:.82rem}
  .file .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5d5da}
  .file .sz{color:var(--faint);flex:0 0 auto}
  .file .st{flex:0 0 auto;display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem}
  .file .st.ok{color:var(--green)} .file .st.bad{color:var(--red)} .file .st.warn{color:#f0c674}
  .vspin{width:11px;height:11px;border:2px solid var(--line-2);border-top-color:var(--seal);border-radius:50%;
    animation:sp .7s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .content{margin-top:1.2rem}
  .content .banner{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--green);margin-bottom:.7rem}
  .render{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.4rem 1.6rem;line-height:1.7}
  .render h1,.render h2,.render h3{letter-spacing:-.02em;margin:1.3rem 0 .5rem} .render h1:first-child{margin-top:0}
  .render h1{font-size:1.4rem} .render h2{font-size:1.15rem} .render h3{font-size:1rem;color:var(--dim)}
  .render p{margin:.6rem 0;color:#dcdce0} .render ul{margin:.5rem 0;padding-left:1.2rem} .render li{margin:.25rem 0;color:#dcdce0}
  .render code{font-family:"JetBrains Mono",monospace;font-size:.85em;background:rgba(255,255,255,.06);
    border:1px solid var(--line);border-radius:5px;padding:.08rem .35rem;color:var(--seal)}
  .render pre{background:#08080b;border:1px solid var(--line);border-radius:10px;padding:.9rem 1rem;overflow:auto}
  .render pre code{background:none;border:0;color:#e8edf4;padding:0}
  .render strong{color:#f5f5f7}
  .note{margin-top:1rem;font-size:.86rem;color:var(--faint);line-height:1.6}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:.4rem 1rem;font-size:.82rem}
  .kv dt{font-family:"JetBrains Mono",monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
  .kv dd{margin:0;font-family:"JetBrains Mono",monospace;color:#c9c9d0;word-break:break-all}
  .err{color:var(--red);font-size:.95rem;margin-top:1.5rem}
  .row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.4rem}
  .btn{border:1px solid var(--line-2);border-radius:9px;padding:.5rem .9rem;font-size:.85rem;color:var(--ink);background:#1a1a1d}
  .btn:hover{border-color:var(--seal);text-decoration:none}
</style>
</head>
<body>
<nav class="top">
  <a class="brand" href="./index.html"><span class="mark">🦭</span>SkillSeal</a>
  <div class="links"><a href="./index.html">Sealed Skills</a><a href="./seal.html#verify">Verify a skill</a></div>
</nav>

<div class="wrap">
  <a class="back" href="./index.html">← Sealed Skills</a>
  <div id="body">
    <div class="head"><h1 id="hname">Opening skill…</h1></div>
    <div class="card"><div class="lbl">Fetching</div><div class="file"><span class="vspin"></span><span class="p" id="fetchmsg">Resolving the content address…</span></div></div>
  </div>
</div>

<script>
// A self verifying skill viewer. Given a content address (a manifest hash or an
// IPFS CID), it fetches the skill's file list, renders the skill, then fetches
// each file BY ITS OWN address, hashes it in the browser, and shows the content
// only when the bytes match. The address is the proof.
(function(){
  const p = new URLSearchParams(location.search);
  const cid = (p.get("cid")||"").trim();
  const addr = (p.get("addr")||"").trim().replace(/^sha256:/,"");
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const hex = u => [...u].map(b=>b.toString(16).padStart(2,"0")).join("");
  const sha = async u => hex(new Uint8Array(await crypto.subtle.digest("SHA-256", u)));

  const GATEWAYS = ["https://dweb.link/ipfs","https://w3s.link/ipfs","https://gateway.pinata.cloud/ipfs","https://ipfs.io/ipfs"];
  // Untrusted content mirrors laid out by hash. Whatever they return is hashed
  // against the address before it is shown, so a mirror can only fail to answer.
  const STORES = ["./blobs/sha256"];
  const storePaths = h => STORES.map(s => `${s}/${h.slice(0,2)}/${h.slice(2,4)}/${h}`);

  async function timedFetch(url, ms=7000){
    const c=new AbortController(), t=setTimeout(()=>c.abort(), ms);
    try{ const r=await fetch(url,{signal:c.signal}); clearTimeout(t); return r; }catch(e){ clearTimeout(t); return null; }
  }
  // Fetch bytes that hash to `want` (sha256 hex), from the store or any gateway.
  async function fetchVerified(want, cids=[]){
    for(const u of storePaths(want)){ const r=await timedFetch(u);
      if(r&&r.ok){ const b=new Uint8Array(await r.arrayBuffer()); if(await sha(b)===want) return b; } }
    for(const c of cids) for(const g of GATEWAYS){ const rr=await timedFetch(`${g}/${c}`);
      if(rr&&rr.ok){ const b=new Uint8Array(await rr.arrayBuffer()); if(await sha(b)===want) return b; } }
    return null;
  }
  // Fetch a manifest by sha256 (store) or by CID (gateway). Returns {bytes, json}.
  async function fetchManifest(){
    if(addr){ const b=await fetchVerified(addr); if(b) return {bytes:b}; }
    if(cid){ for(const g of GATEWAYS){ const r=await timedFetch(`${g}/${cid}`); if(r&&r.ok) return {bytes:new Uint8Array(await r.arrayBuffer())}; } }
    return null;
  }

  // A small, safe Markdown renderer: headings, lists, code fences, inline code, bold.
  function md(src){
    const lines = esc(src).split("\n"); let out=[], i=0;
    while(i<lines.length){
      let l=lines[i];
      if(/^```/.test(l)){ const buf=[]; i++; while(i<lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push(`<pre><code>${buf.join("\n")}</code></pre>`); continue; }
      if(/^#{1,3}\s/.test(l)){ const n=l.match(/^#+/)[0].length; out.push(`<h${n}>${inline(l.replace(/^#+\s/,""))}</h${n}>`); i++; continue; }
      if(/^\s*[-*]\s/.test(l)){ const items=[]; while(i<lines.length && /^\s*[-*]\s/.test(lines[i])) items.push(`<li>${inline(lines[i++].replace(/^\s*[-*]\s/,""))}</li>`); out.push(`<ul>${items.join("")}</ul>`); continue; }
      if(/^\s*$/.test(l)){ i++; continue; }
      const buf=[l]; i++; while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s|```|\s*[-*]\s)/.test(lines[i])) buf.push(lines[i++]);
      out.push(`<p>${inline(buf.join(" "))}</p>`);
    }
    return out.join("\n");
  }
  const inline = s => s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");

  function fail(msg){
    $("body").innerHTML = `<div class="head"><h1>Could not open this skill</h1></div>`
      + `<div class="err">${esc(msg)}</div>`
      + `<div class="row"><a class="btn" href="./index.html">← Back to skills</a>`
      + (cid?`<a class="btn" href="https://ipfs.io/ipfs/${cid}" target="_blank" rel="noopener">Open raw on IPFS →</a>`:"")+`</div>`;
  }

  async function main(){
    if(!cid && !addr){ return fail("No content address was provided."); }
    const m = await fetchManifest();
    if(!m){ return fail("Could not fetch the manifest from the store or any gateway. The address is valid; the bytes may not be mirrored where this page can reach."); }
    let man; try{ man = JSON.parse(new TextDecoder().decode(m.bytes)); }catch(e){ return fail("The address did not resolve to a skill manifest."); }
    const core = man.core || man;                       // v2 wraps a signed core; v1 is the list itself
    const files = core.files || [];
    const name = core.name || "skill", version = core.version || core.v || "";

    $("body").innerHTML = `
      <div class="head"><h1>${esc(name)}</h1>${version?`<span class="ver">v${esc(String(version))}</span>`:""}<span class="spill ok">🦭 sealed</span></div>
      <p class="sub">This is the skill pinned at a content address. Each file below is fetched by its own hash and checked in your browser. The address is the proof.</p>
      <div class="card"><div class="lbl">Files</div><div class="files" id="files"></div></div>
      <div id="content"></div>
      <div class="card"><div class="lbl">Address</div><dl class="kv">
        <dt>manifest</dt><dd>${addr?("sha256:"+esc(addr)):esc(cid)}</dd>
        ${core.publisherKey?`<dt>publisher</dt><dd>${esc(core.publisherKey)}</dd>`:""}
      </dl></div>
      <div class="row"><a class="btn" href="./index.html">← All skills</a>${cid?`<a class="btn" href="https://ipfs.io/ipfs/${cid}" target="_blank" rel="noopener">Open raw on IPFS →</a>`:""}</div>`;

    const fl = $("files");
    for(const f of files){
      const el = document.createElement("div"); el.className="file";
      el.innerHTML = `<span class="p" title="${esc(f.path)}">${esc(f.path)}</span><span class="sz">${f.size??"?"} B</span><span class="st"><span class="vspin"></span>checking…</span>`;
      fl.appendChild(el); f._el = el;
    }
    // Verify each file; render SKILL.md content when it matches.
    for(const f of files){
      const st = f._el.querySelector(".st");
      const want = String(f.address||"").replace(/^sha256:/,"");
      const bytes = await fetchVerified(want, f.cid?[f.cid]:[]);
      if(bytes){
        st.className="st ok"; st.innerHTML="✓ matches its hash";
        if(/(^|\/)SKILL\.md$/i.test(f.path)){
          const text = new TextDecoder().decode(bytes).replace(/^---[\s\S]*?\n---\s*/, ""); // drop frontmatter; shown in the header
          $("content").innerHTML = `<div class="content"><div class="banner">✓ content verified in your browser · hashes to ${esc(want.slice(0,12))}…</div><div class="render">${md(text)}</div></div>`;
        }
      } else {
        st.className="st warn"; st.innerHTML="not mirrored here";
      }
    }
    if(!$("content").innerHTML){
      $("content").innerHTML = `<p class="note">The file list is pinned and verified, but the file contents are not mirrored where this page can reach. On a network that can reach the pinning gateway, or once the files are hosted in the content store, the full <code class="mono">SKILL.md</code> renders here, verified byte for byte.</p>`;
    }
  }
  main();
})();
</script>
</body>
</html>
